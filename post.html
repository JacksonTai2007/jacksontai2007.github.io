<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章 · JacksonTai</title>
  <meta name="description" content="JacksonTai 的文章 — 逆向工程、移动安全、Python 与前端笔记。">
  <meta name="author" content="JacksonTai">

  <!-- Static fallbacks: link-preview scrapers don't run JS, so these are what
       they see. post.js replaces them with the real article metadata for
       crawlers that do execute scripts. -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="JacksonTai 的博客">
  <meta property="og:title" content="文章 · JacksonTai">
  <meta property="og:description" content="逆向工程、移动安全、Python 与前端笔记。">
  <meta property="og:image" content="https://jacksontai2007.github.io/static/img/logo.png">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://jacksontai2007.github.io/static/img/logo.png">

  <meta name="theme-color" content="#f3f0e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#211e19" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="./static/img/favicon.ico">
  <link rel="alternate" type="application/rss+xml" title="JacksonTai 的博客" href="./feed.xml">
  <link rel="preload" href="./assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./assets/css/blog.css?v=7">
  <link rel="stylesheet" href="./assets/css/highlight-theme.css?v=7">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <script>
    // Fire both data requests here, before the deferred scripts are even
    // fetched. The article id is already in the URL, so the markdown never had
    // to wait on posts/index.json — and neither request has to wait on ~46 KB
    // of deferred JS parsing. blog.js and post.js pick these promises up.
    // Trade-off: an unknown ?id= now costs one speculative 404 on the .md,
    // since we can't know the id is bogus until index.json lands. The reader
    // still sees "没有找到这篇文章" — only the console differs.
    (function () {
      try {
        var id = new URLSearchParams(location.search).get("id");
        if (!id) return;
        window.__boot = {
          index: fetch("posts/index.json", { cache: "no-cache" }),
          // published markdown is immutable in practice, so let it be cached
          md: fetch("posts/" + encodeURIComponent(id) + ".md")
        };
        // keep a rejection from going unhandled before the consumers attach
        window.__boot.index.catch(function () {});
        window.__boot.md.catch(function () {});
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header"></header>

  <main id="main">
    <div class="wrap wrap-wide">
      <div class="article-layout">
        <section>
          <header class="article-header" id="article-head"></header>
          <article class="prose" id="article">
            <p class="skeleton">正在加载…</p>
          </article>
          <nav class="post-nav" id="post-nav" aria-label="上一篇 / 下一篇"></nav>
        </section>

        <aside class="toc-wrap" aria-label="目录">
          <div class="toc" id="toc"></div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <!-- highlight.min.js is not listed here on purpose: enhance.js injects it on
       demand, after the article is on screen, and skips it entirely for posts
       with no code blocks. -->
  <script src="./assets/js/marked.min.js?v=7" defer></script>
  <script src="./assets/js/blog.js?v=7" defer></script>
  <script src="./assets/js/enhance.js?v=7" defer></script>
  <script src="./assets/js/post.js?v=7" defer></script>
</body>
</html>
