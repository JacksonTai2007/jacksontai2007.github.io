<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · JacksonTai</title>
  <meta name="description" content="页面不存在。">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3f0e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#211e19" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/static/img/favicon.ico">
  <link rel="stylesheet" href="/assets/css/blog.css?v=6">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header"></header>

  <main id="main">
    <div class="wrap">
      <section class="block">
        <p class="kicker">404</p>
        <article class="prose">
          <h1 style="margin-top:0">这一页不存在</h1>
          <p>你要找的页面<span id="tried"></span>不在这里 —— 可能已被移动，或者链接拼错了。</p>
        </article>
        <ul class="cat-list" style="margin-top:18px">
          <li class="cat-row"><a href="/">首页</a><span class="leader" aria-hidden="true"></span><span class="n">回到起点</span></li>
          <li class="cat-row"><a href="/blog.html">全部文章</a><span class="leader" aria-hidden="true"></span><span class="n">搜索与筛选</span></li>
          <li class="cat-row"><a href="/archive.html">归档</a><span class="leader" aria-hidden="true"></span><span class="n">按年浏览</span></li>
          <li class="cat-row"><a href="/about.html">关于</a><span class="leader" aria-hidden="true"></span><span class="n">找到我</span></li>
        </ul>
      </section>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="/assets/js/blog.js?v=6" defer></script>
  <script>
    // echo back the path the visitor actually asked for
    window.addEventListener("DOMContentLoaded", function () {
      var el = document.getElementById("tried");
      if (el && location.pathname && location.pathname !== "/404.html") {
        el.textContent = "（" + location.pathname.slice(0, 120) + "）";
      }
    });
  </script>
</body>
</html>
