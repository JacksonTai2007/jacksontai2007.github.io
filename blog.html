<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章 · JacksonTai</title>
  <meta name="description" content="JacksonTai 的全部文章 — 逆向工程、移动安全、Python 与前端笔记，支持标签筛选与全文搜索。">

  <link rel="canonical" href="https://jacksontai2007.github.io/blog.html">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JacksonTai 的博客">
  <meta property="og:title" content="文章 · JacksonTai">
  <meta property="og:description" content="全部文章 — 逆向工程、移动安全、Python 与前端笔记。">

  <meta property="og:image" content="https://jacksontai2007.github.io/static/img/logo.png">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="文章 · JacksonTai">
  <meta name="twitter:description" content="全部文章 — 逆向工程、移动安全、Python 与前端笔记。">

  <meta name="theme-color" content="#0a0d11" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <link rel="icon" href="./static/img/favicon.ico">
  <link rel="alternate" type="application/rss+xml" title="JacksonTai 的博客" href="./feed.xml">
  <link rel="preload" href="./assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./assets/css/blog.css?v=5">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header"></header>

  <main id="main">
    <div class="wrap">
      <section class="win">
        <div class="win-bar">
          <span class="win-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="win-title">~/posts</span>
          <span class="win-right"><a href="./archive.html">archive →</a></span>
        </div>
        <div class="win-body">
          <label class="search">
            <span class="p" aria-hidden="true">$ grep -i</span>
            <input id="search" type="search" placeholder="搜索标题、标签、摘要…"
                   autocomplete="off" aria-label="搜索文章">
            <kbd>/</kbd>
          </label>

          <div class="filter-tags" id="filter" role="group" aria-label="按标签筛选"></div>
          <p class="result-count" id="count" role="status"></p>

          <ul class="post-list" id="post-list">
            <li class="skeleton">loading…</li>
          </ul>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="./assets/js/blog.js?v=5" defer></script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      Blog.renderBlog("#post-list", {
        search: "#search",
        filter: "#filter",
        count: "#count"
      });
    });
  </script>
</body>
</html>
