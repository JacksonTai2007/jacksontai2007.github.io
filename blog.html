  <script>
    // resolve the theme before first paint so there is no flash of the wrong mode
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header"></header>

  <main id="main">
    <div class="wrap narrow">
      <header class="page-head">
        <h1>文章</h1>
        <p>逆向工程、移动安全、Python 与前端笔记。可以按标题、标签和摘要搜索，也可以按标签筛选，筛选条件会写进网址，方便分享。</p>
      </header>

      <label class="search">
        <span class="search-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></span>
        <input id="search" type="search" placeholder="搜索标题、标签、摘要"
               autocomplete="off" aria-label="搜索文章">
        <kbd aria-hidden="true">/</kbd>
      </label>

      <div class="filter-tags" id="filter" role="group" aria-label="按标签筛选"></div>
      <p class="result-count" id="count" role="status"></p>

      <ul class="post-list" id="post-list">
        <li class="skeleton">正在加载文章列表…</li>
      </ul>

      <p class="list-foot">想按时间顺序浏览，可以看<a class="link" href="./archive.html">归档</a>。</p>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="./assets/js/blog.js?v=8" defer></script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      Blog.renderBlog("#post-list", {
        search: "#search",
        filter: "#filter",
        count: "#count"
      });
    });
  </script>
</body>
