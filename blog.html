<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:type" content="website">

  <meta name="theme-color" content="#f3f0e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#211e19" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="./static/img/favicon.ico">
  <link rel="alternate" type="application/rss+xml" title="JacksonTai 的博客" href="./feed.xml">
  <link rel="stylesheet" href="./assets/css/blog.css?v=7">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header"></header>

  <main id="main">
    <div class="wrap">
      <section class="block">
        <div class="sec-head">
          <p class="kicker">全部文章</p>
          <a class="more" href="./archive.html">按年归档 →</a>
        </div>

        <label class="search">
          <input id="search" type="search" placeholder="搜索标题、标签、摘要…"
                 autocomplete="off" aria-label="搜索文章">
          <kbd>/</kbd>
        </label>

        <div class="filter-tags" id="filter" role="group" aria-label="按标签筛选"></div>
        <p class="result-count" id="count" role="status"></p>

        <ul class="post-list" id="post-list">
          <li class="skeleton">正在加载…</li>
        </ul>
      </section>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="./assets/js/blog.js?v=7" defer></script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      Blog.renderBlog("#post-list", {
        search: "#search",
        filter: "#filter",
        count: "#count"
      });
    });
  </script>
</body>
</html>
