<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light" data-font="md">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>外交知識題庫練習</title>
  <meta name="description" content="第十七屆澳門青少年外交知識競賽推廣賽 100 題題庫：順序練習、隨機練習、智能複習、錯題本、收藏、模擬考試、背題模式，手機與電腦皆可用。">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3f0e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#211e19" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="外交題庫">
  <link rel="icon" href="../static/img/favicon.ico">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./quiz.css?v=1">
  <script>
    // 在首次繪製前決定主題與字號，避免閃爍；theme 這個 key 與博客共用
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
        var s = JSON.parse(localStorage.getItem("quiz:settings") || "{}");
        if (s.font) document.documentElement.setAttribute("data-font", s.font);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#app">跳到主要內容</a>

  <header class="topbar">
    <div class="in">
      <a class="brand" href="../" title="回到 JacksonTai 首頁"><span class="back">← 首頁</span><span>題庫練習</span></a>
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-help" type="button" aria-label="鍵盤快捷鍵與說明">?</button>
      <button class="icon-btn theme-toggle" id="btn-theme" type="button" aria-label="切換深淺色">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" type="button" aria-label="設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      </button>
    </div>
  </header>

  <main id="app">

    <!-- ===== 首頁 ===== -->
    <section id="screen-home" class="screen" aria-label="首頁">
      <div class="hero">
        <p class="kicker">Question Bank · 題庫練習</p>
        <h1 id="hero-title">題庫練習</h1>
        <p class="lead" id="hero-lead">正在載入題庫…</p>
        <div class="bank-row" id="bank-row" hidden>
          <label for="bank-select">題庫</label>
          <select id="bank-select"></select>
        </div>
      </div>

      <div class="stats" id="stats" data-anim></div>

      <div class="progress-wrap" data-anim>
        <div class="progress-meta"><span>已練習進度</span><span id="seen-label">0 / 0</span></div>
        <div class="progress-line"><i id="seen-bar"></i></div>
      </div>

      <h2 class="section-title" data-anim>練習模式</h2>
      <div class="modes" id="modes"></div>

      <p class="foot">題目來源：第十七屆澳門青少年外交知識競賽推廣賽題目（PDF）· 進度只保存在本機瀏覽器 · 動畫由 <a href="https://gsap.com" target="_blank" rel="noopener">GSAP</a> 驅動</p>
    </section>

    <!-- ===== 練習 / 考試 ===== -->
    <section id="screen-practice" class="screen" aria-label="練習" hidden>
      <div class="practice-grid">
        <div class="p-main">
          <div class="p-head">
            <button class="icon-btn" id="btn-exit" type="button" aria-label="返回首頁">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
            </button>
            <span class="mode-name" id="p-mode">練習</span>
            <span class="timer" id="p-timer" hidden>00:00</span>
            <span class="counter" id="p-counter">0 / 0</span>
          </div>
          <div class="p-progress"><i id="p-bar"></i></div>

          <div class="stage" id="stage" data-anim></div>

          <div class="actions" id="actions">
            <div class="in">
              <button class="btn icon" id="btn-prev" type="button" aria-label="上一題">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <button class="btn icon" id="btn-fav" type="button" aria-label="收藏這題" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
              </button>
              <button class="btn icon" id="btn-sheet" type="button" aria-label="答題卡">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
              </button>
              <button class="btn primary grow" id="btn-next" type="button">下一題</button>
            </div>
          </div>
        </div>

        <aside class="sheet" id="sheet" aria-label="答題卡">
          <div class="sheet-head">
            <span class="handle" aria-hidden="true"></span>
            <strong>答題卡</strong>
            <span class="muted" id="sheet-count">已答 0 / 0</span>
            <button class="icon-btn small" id="btn-sheet-close" type="button" aria-label="關閉答題卡">×</button>
          </div>
          <div class="sheet-body"><div class="grid" id="sheet-grid"></div></div>
          <div class="legend">
            <span><i class="l-ok"></i>答對</span>
            <span><i class="l-bad"></i>答錯</span>
            <span><i class="l-done"></i>已答</span>
            <span><i class="l-cur"></i>目前</span>
            <span><i class="l-fav"></i>收藏</span>
          </div>
          <div class="sheet-foot"><button class="btn grow" id="btn-finish" type="button">結束本輪</button></div>
        </aside>
      </div>
    </section>

    <!-- ===== 結果 ===== -->
    <section id="screen-result" class="screen" aria-label="結果" hidden>
      <div class="p-head">
        <button class="icon-btn" id="btn-result-home" type="button" aria-label="返回首頁">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        </button>
        <span class="mode-name" id="r-title">結果</span>
      </div>
      <div class="result-hero" data-anim>
        <div class="ring" id="ring">
          <svg viewBox="0 0 132 132" aria-hidden="true">
            <circle class="track" cx="66" cy="66" r="56"/>
            <circle class="bar" id="ring-bar" cx="66" cy="66" r="56"/>
          </svg>
          <div class="ring-val"><span id="ring-num">0</span><small id="ring-unit">分</small></div>
        </div>
        <div class="result-nums" id="result-nums"></div>
      </div>
      <div class="result-actions" id="result-actions" data-anim></div>
      <h2 class="section-title" id="review-title" data-anim>錯題回顧</h2>
      <ul class="review-list" id="review-list"></ul>
    </section>

    <!-- ===== 瀏覽 / 搜尋 ===== -->
    <section id="screen-browse" class="screen" aria-label="瀏覽題目" hidden>
      <div class="p-head">
        <button class="icon-btn" id="btn-browse-home" type="button" aria-label="返回首頁">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        </button>
        <span class="mode-name">瀏覽題目</span>
        <span class="counter" id="browse-count"></span>
      </div>
      <div class="toolbar" data-anim>
        <input class="search" id="search" type="search" placeholder="搜尋題目關鍵字或題號…" autocomplete="off" aria-label="搜尋題目">
        <div class="seg" id="browse-status" role="group" aria-label="篩選">
          <button type="button" data-v="all" aria-pressed="true">全部</button>
          <button type="button" data-v="wrong" aria-pressed="false">錯題</button>
          <button type="button" data-v="fav" aria-pressed="false">收藏</button>
          <button type="button" data-v="new" aria-pressed="false">未做</button>
        </div>
        <button class="chip" id="toggle-answers" type="button" aria-pressed="true">顯示答案</button>
      </div>
      <ul class="list" id="browse-list"></ul>
      <p class="empty" id="browse-empty" hidden>沒有符合的題目</p>
    </section>

  </main>

  <div class="scrim" id="scrim"></div>

  <div class="modal" id="modal" hidden>
    <div class="box" role="dialog" aria-modal="true" aria-label="對話框"><div id="modal-content"></div></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./vendor/gsap/gsap.min.js"></script>
  <script src="./vendor/gsap/Flip.min.js"></script>
  <script src="./vendor/gsap/Observer.min.js"></script>
  <script src="./vendor/gsap/ScrollToPlugin.min.js"></script>
  <script src="./vendor/gsap/SplitText.min.js"></script>
  <script src="./vendor/gsap/DrawSVGPlugin.min.js"></script>
  <script src="./quiz.js?v=1"></script>
</body>
</html>
